note: >-
  Two real documents were returned. The MCP resource host mcp.syncly.app serves RFC 9728
  OAuth Protected Resource Metadata, which names https://social-server.syncly.app as the
  authorization server; that host in turn serves RFC 8414 OAuth Authorization Server
  Metadata. Neither was recorded in the previous enrichment round. The marketing host
  syncly.app (Framer) and the API host api.syncly.app return 404 for every /.well-known/
  path. creator.syncly.app is a Vercel single-page app that answers HTTP 200 with an HTML
  shell for EVERY /.well-known/ path, including agent-card.json and security.txt; those are
  recorded as soft-200 misses, not documents.
