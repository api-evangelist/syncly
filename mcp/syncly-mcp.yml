connection_flow:
  source: https://syncly-a76215af.mintlify.app/en/start/connect-mcp-clients
  steps:
  - Log in to Syncly and open Settings via the gear icon in the lower-left corner.
  - Open My Account and scroll to the Connected Apps section.
  - Find the AI client (Claude or ChatGPT) and select Connect.
  - Sign in to the AI client account when prompted.
  - Review the requested permissions and approve the connection.
  - Return to Syncly and confirm the client shows as connected.
  - Open a new conversation in the client before testing.
  revocation: Select Revoke in Connected Apps to remove an app's access to Syncly.
  note: >-
    The documented path is a provider-initiated connect flow from inside the Syncly app, not a
    URL a user pastes into a client. Syncly does not publish the endpoint in its docs; the
    endpoint recorded above was established by probing mcp.syncly.app directly.
