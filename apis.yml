apis:
- name: Syncly Social MCP Server
  description: >-
    Syncly's only programmatic surface. A hosted remote Model Context Protocol server that
    exposes a connected Syncly workspace — TikTok, Reels and Shorts social listening, creator
    discovery, competitor benchmarking and reporting — to any AI client that supports remote
    MCP connectors. Agents POST JSON-RPC 2.0 over MCP Streamable HTTP to
    https://mcp.syncly.app/mcp with an OAuth 2.1 bearer token carrying the syncly:read scope.
    The server publishes RFC 9728 protected-resource metadata pointing at its authorization
    server at https://social-server.syncly.app, which publishes RFC 8414 metadata with dynamic
    client registration and PKCE (S256). A FastAPI-generated OpenAPI 3.1.0 document is served
    at the host root, covering the discovery and health endpoints; the product tools themselves
    are behind the OAuth gate and tools/list returns 401 to anonymous callers.
  humanURL: https://syncly.app/social/mcp
  baseURL: https://mcp.syncly.app
