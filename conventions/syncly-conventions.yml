authentication:
  style: OAuth 2.1 bearer token in the Authorization header
  discovery: RFC 9728 protected-resource metadata, then RFC 8414 authorization-server metadata
  client_registration: dynamic (RFC 7591) at https://social-server.syncly.app/oauth/register
  pkce: required, S256
  public_clients: token_endpoint_auth_methods_supported is ["none"]
  scopes: [syncly:read, offline_access]
  see: authentication/syncly-authentication.yml
idempotency:
  supported: false
  header: null
  note: >-
    No idempotency key, no retry-safety contract, and no de-duplication guidance is published,
    and none appears in the OpenAPI. Consistent with a read-only surface (the sole resource
    scope is syncly:read), but the absence is recorded as absence. No Idempotency pointer is
    emitted in apis.yml.
pagination:
  style: null
  note: >-
    Not published. The MCP tool schemas that would carry any cursor parameter are OAuth-gated,
    so pagination cannot be observed without a workspace token.
