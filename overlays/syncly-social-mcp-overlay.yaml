      product capabilities are NOT in this document — they are exposed as MCP tools over
      JSON-RPC at https://mcp.syncly.app/mcp, which requires an OAuth 2.1 bearer token with
      scope syncly:read.
    x-apievangelist-harvested: '2026-08-13'
    x-apievangelist-source: https://mcp.syncly.app/openapi.json
    x-mcp-endpoint: https://mcp.syncly.app/mcp
