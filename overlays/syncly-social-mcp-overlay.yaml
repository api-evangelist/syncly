    description: >-
      RFC 9728 protected-resource metadata for the /mcp resource. Returns the same document as
      the root /.well-known/oauth-protected-resource path. This is the URL named in the
      mcp/www_authenticate challenge returned on an unauthenticated JSON-RPC call.
- target: $.paths['/.well-known/openai-apps-challenge'].get
  description: Explain the non-obvious verification endpoint.
  update:
